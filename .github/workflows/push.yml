name: "on-push"
on:
  - push
jobs:
  build:
    name: Build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-15-intel
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.2"
          - runner: macos-26-intel
            xcode: "26.2"
          - runner: macos-14
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "26.0.1"
          - runner: macos-26
            xcode: "26.3"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build
      run: ./build.sh

  test:
    name: Test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            xcode: "26.2"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Test
      run: |
        xcodebuild test \
          -project "Gas Mask.xcodeproj" \
          -scheme "Gas Mask" \
          -destination "platform=macOS,arch=x86_64" \
          -disable-concurrent-testing \
          -resultBundlePath /tmp/TestResults.xcresult \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Test result summary
      if: always()
      run: |
        if [ -d /tmp/TestResults.xcresult ]; then
          xcresulttool get --path /tmp/TestResults.xcresult --format json 2>/dev/null | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        def walk(node, depth=0):
            if isinstance(node, dict):
                if node.get('_type', {}).get('_name') == 'ActionTestSummary':
                    status = node.get('testStatus', {}).get('_value', '?')
                    name = node.get('name', {}).get('_value', '?')
                    print(f'  {status}: {name}')
                for v in node.values():
                    walk(v, depth+1)
            elif isinstance(node, list):
                for item in node:
                    walk(item, depth+1)
        walk(data)
        " 2>/dev/null || echo "Could not parse xcresult"
        else
          echo "No xcresult bundle"
        fi
