name: "on-push"
on:
  - push
jobs:
  build:
    name: Build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-15-intel
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.2"
          - runner: macos-26-intel
            xcode: "26.2"
          - runner: macos-14
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "26.0.1"
          - runner: macos-26
            xcode: "26.3"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build
      run: ./build.sh

  test:
    name: Test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            xcode: "26.2"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build for testing
      run: xcodebuild build-for-testing -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Test with system log capture
      run: |
        log stream --predicate 'process == "Gas Mask" OR process == "xctest" OR process == "XCTRunner" OR (subsystem == "com.apple.xctest")' --style compact > /tmp/test_syslog.txt 2>&1 &
        LOG_PID=$!
        sleep 1

        set +e
        xcodebuild test-without-building \
          -project "Gas Mask.xcodeproj" \
          -scheme "Gas Mask" \
          -destination "platform=macOS" \
          -resultBundlePath /tmp/TestResults.xcresult \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        TEST_EXIT=$?
        set -e

        kill $LOG_PID 2>/dev/null || true
        sleep 1

        echo "=== System log during test ==="
        cat /tmp/test_syslog.txt | head -200

        echo ""
        echo "=== xcresult diagnostics ==="
        if [ -d /tmp/TestResults.xcresult ]; then
          xcresulttool get --path /tmp/TestResults.xcresult 2>/dev/null | head -100 || echo "xcresulttool failed"
        else
          echo "No xcresult bundle found"
        fi

        echo ""
        echo "=== Crash reports (last 5 min) ==="
        find ~/Library/Logs/DiagnosticReports -name "*Gas*" -mmin -5 -exec cat {} \; 2>/dev/null | head -100 || echo "None"

        exit $TEST_EXIT
