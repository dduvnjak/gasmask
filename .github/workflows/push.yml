name: "on-push"
on:
  - push
jobs:
  build:
    name: Build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-15-intel
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.2"
          - runner: macos-26-intel
            xcode: "26.2"
          - runner: macos-14
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "26.0.1"
          - runner: macos-26
            xcode: "26.3"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build
      run: ./build.sh

  test:
    name: Test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            xcode: "26.2"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build for testing
      run: xcodebuild build-for-testing -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Diagnose test host
      run: |
        APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Gas Mask.app" -path "*/Debug/*" | head -1)
        echo "App path: $APP"
        echo "--- Binary architectures ---"
        file "$APP/Contents/MacOS/Gas Mask"
        lipo -info "$APP/Contents/MacOS/Gas Mask"
        echo "--- Test bundle ---"
        ls -la "$APP/Contents/PlugIns/"
        file "$APP/Contents/PlugIns/Gas Mask Tests.xctest/Contents/MacOS/Gas Mask Tests"
        echo "--- Try launching app (5s timeout) ---"
        "$APP/Contents/MacOS/Gas Mask" &
        APP_PID=$!
        sleep 5
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App is still running (PID $APP_PID) - GOOD"
          kill $APP_PID
        else
          wait $APP_PID 2>/dev/null
          echo "App exited with code $? within 5 seconds - BAD"
        fi
        echo "--- Recent crash reports ---"
        ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || echo "No crash reports"

    - name: Test
      run: xcodebuild test-without-building -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
