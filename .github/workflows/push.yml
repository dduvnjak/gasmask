name: "on-push"
on:
  - push
jobs:
  test-intel-macos26:
    name: Test macos-26-intel (Xcode ${{ matrix.xcode }})
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.5"
          - xcode: "26.2"
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: Show environment
      run: |
        xcodebuild -version
        sysctl hw.machine hw.cpu64bit_capable || true
        sw_vers

    - name: Resolve package dependencies
      run: xcodebuild -resolvePackageDependencies -project "Gas Mask.xcodeproj" -scheme "Gas Mask"

    - name: Build for testing
      run: xcodebuild build-for-testing -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Test (test-without-building)
      id: twb
      continue-on-error: true
      run: xcodebuild test-without-building -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80

    - name: Test (standard xcodebuild test)
      id: standard
      if: steps.twb.outcome == 'failure'
      continue-on-error: true
      run: xcodebuild test -project "Gas Mask.xcodeproj" -scheme "Gas Mask" -destination "platform=macOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80

    - name: Test (xcrun xctest direct)
      id: direct
      if: steps.twb.outcome == 'failure' && steps.standard.outcome == 'failure'
      continue-on-error: true
      run: |
        TEST_BUNDLE=$(find ~/Library/Developer/Xcode/DerivedData -name "Gas Mask Tests.xctest" -type d 2>/dev/null | head -1)
        if [ -z "$TEST_BUNDLE" ]; then
          echo "No test bundle found in DerivedData, searching build dir..."
          TEST_BUNDLE=$(find . -name "Gas Mask Tests.xctest" -type d 2>/dev/null | head -1)
        fi
        echo "Test bundle: $TEST_BUNDLE"
        if [ -n "$TEST_BUNDLE" ]; then
          xcrun xctest "$TEST_BUNDLE" 2>&1 | tail -40
        else
          echo "ERROR: Could not find test bundle"
          exit 1
        fi

    - name: Summary
      if: always()
      run: |
        echo "=== Results for Xcode ${{ matrix.xcode }} ==="
        echo "test-without-building: ${{ steps.twb.outcome }}"
        echo "standard xcodebuild test: ${{ steps.standard.outcome }}"
        echo "xcrun xctest direct: ${{ steps.direct.outcome }}"
        if [ "${{ steps.twb.outcome }}" = "success" ] || [ "${{ steps.standard.outcome }}" = "success" ] || [ "${{ steps.direct.outcome }}" = "success" ]; then
          echo "At least one approach succeeded!"
        else
          echo "All approaches failed."
          exit 1
        fi
